name: CI

# Lean while the package is early: PRs and manual runs only. Local
# `python dev.py check` is the pre-push gate.
#
# NOTE: this app depends on private nativelite repos via git. The default
# GITHUB_TOKEN cannot read sibling private repos, so CI needs an org read
# token in the ORG_READ_TOKEN secret until the crates go public.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustc --version && cargo --version
      - name: Authorize org git dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.ORG_READ_TOKEN }}@github.com/nativelite/".insteadOf "https://github.com/nativelite/"
      - run: python dev.py check   # dependency guard + cargo test
