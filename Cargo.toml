[package]
name = "atrium"
version = "0.30.0"
edition = "2021"
rust-version = "1.70"
description = "tmux for agents: a multi-agent terminal that hosts your own CLIs in switchable panes with agent-aware chrome. 100% nativelite - zero third-party dependencies."
license = "MIT"
repository = "https://github.com/nativelite/amux"
keywords = ["terminal", "multiplexer", "agents", "claude", "nativelite"]
categories = ["command-line-utilities"]

# nativelite app rule: zero THIRD-PARTY dependencies; org crates only.
[dependencies]
abus = { package = "nativelite-abus", version = "0.1", path = "../abus" }
pty = { package = "nativelite-pty", version = "0.3", path = "../pty-rs" }
akey = { package = "nativelite-akey", version = "0.2", path = "../akey" }
rawterm = { package = "nativelite-rawterm", version = "0.2", path = "../rawterm-rs" }
ansi = { package = "nativelite-ansi", version = "0.1", path = "../ansi-rs" }
vterm = { package = "nativelite-vterm", version = "0.3", path = "../vterm-rs" }
agsess = { package = "nativelite-agsess", version = "0.1", path = "../agsess" }
json = { package = "nativelite-json", version = "0.1", path = "../json-rs" }

[lib]
# Internal library name kept as `amux` on purpose: nothing outside this crate
# depends on it, and the whole crate's ~200 `amux::` paths + the runtime
# contract (AMUX_* env vars, `amux-*` IPC/file prefixes, process-ancestry
# detection) rename together in a separate, run-tested pass. The crate PUBLISHES
# as `atrium` (the [package] name), which is what resolves the crates.io collision.
name = "amux"
path = "src/lib.rs"

[[bin]]
name = "amux"
path = "src/main.rs"
