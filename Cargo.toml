[package]
name = "amux"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "tmux for agents: a multi-agent terminal that hosts your own CLIs in switchable panes with agent-aware chrome. 100% nativelite - zero third-party dependencies."
license = "MIT"
repository = "https://github.com/nativelite/amux"
keywords = ["terminal", "multiplexer", "agents", "claude", "nativelite"]
categories = ["command-line-utilities"]

# nativelite app rule: zero THIRD-PARTY dependencies; org crates only.
[dependencies]
pty = { git = "https://github.com/nativelite/pty-rs", branch = "main" }
rawterm = { git = "https://github.com/nativelite/rawterm-rs", branch = "main" }
ansi = { git = "https://github.com/nativelite/ansi-rs", branch = "main" }

[lib]
name = "amux"
path = "src/lib.rs"

[[bin]]
name = "amux"
path = "src/main.rs"
