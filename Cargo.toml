[package]
name = "atrium"
version = "0.37.2"
edition = "2021"
rust-version = "1.70"
description = "tmux for agents: a multi-agent terminal that hosts your own CLIs in switchable panes with agent-aware chrome. 100% nativelite - zero third-party dependencies."
license-file = "LICENSE"
repository = "https://github.com/nativelite/atrium"
keywords = ["terminal", "multiplexer", "agents", "claude", "nativelite"]
categories = ["command-line-utilities"]

# nativelite app rule: zero THIRD-PARTY dependencies; org crates only.
[dependencies]
abus = { package = "nativelite-abus", version = "0.2.1", path = "../abus" }
pty = { package = "nativelite-pty", version = "0.4.1", path = "../pty-rs" }
akey = { package = "nativelite-akey", version = "0.2", path = "../akey" }
rawterm = { package = "nativelite-rawterm", version = "0.2.2", path = "../rawterm-rs" }
ansi = { package = "nativelite-ansi", version = "0.4.0", path = "../ansi-rs" }
vterm = { package = "nativelite-vterm", version = "0.5.3", path = "../vterm-rs" }
agsess = { package = "nativelite-agsess", version = "0.2.3", path = "../agsess" }
json = { package = "nativelite-json", version = "0.1", path = "../json-rs" }

[lib]
name = "atrium"
path = "src/lib.rs"

[[bin]]
name = "atrium"
path = "src/main.rs"

# Key echo, idle CPU and output-flood throughput against the bare shell.
# `cargo bench --bench terminal`; under `cargo test` it only builds.
[[bench]]
name = "terminal"
harness = false

# Enforced by the gate: `dev.py lint` runs clippy with -D warnings. Cargo < 1.74
# ignores this table (with a warning), so the 1.70 MSRV build is unaffected.
# Not here: `allow_attributes_without_reason` - its `reason =` needs Rust 1.81.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn" # every unsafe block states why it is sound
unwrap_used = "warn"                # expect("invariant") or `?`; tests: clippy.toml
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
